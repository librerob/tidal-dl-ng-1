name: Refresh security lockfile
on: [pull_request]
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for Pillow use and regenerate the lockfile
        run: |
          if git grep -nEi '(^|[^[:alnum:]_])(from PIL|import PIL|import pillow)' -- '*.py'; then
            echo "Pillow is imported directly"
            exit 1
          fi
          python -m pip install poetry==2.5.1
          poetry lock
          poetry check --lock
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          from textwrap import wrap

          encoded = base64.b64encode(gzip.compress(Path("poetry.lock").read_bytes(), mtime=0)).decode()
          for line in wrap(encoded, 900):
              print("LOCK_DATA:" + line)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: security-poetry-lock
          path: poetry.lock
