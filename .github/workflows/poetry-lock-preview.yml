name: Regenerate Poetry lock
on: [pull_request]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install poetry==2.5.1
          poetry lock
          poetry check --lock
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-poetry-lock
          path: poetry.lock
