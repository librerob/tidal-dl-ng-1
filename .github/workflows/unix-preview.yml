name: Cross-platform preview

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/unix-preview.yml]

permissions:
  contents: read

concurrency:
  group: unix-preview-assets
  cancel-in-progress: false

env:
  RELEASE_TAG: 0.24.6-preview.2
  RELEASE_COMMIT: aac92e77c8965874be129af18d4e8db7653cfb05

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
            architecture: arm64
          - runner: macos-15-intel
            target: macos-x64
            architecture: x64
          - runner: ubuntu-22.04
            target: linux-x64
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 squashfs-tools
      - name: Install and test
        run: |
          python -m venv "$RUNNER_TEMP/preview"
          py="$RUNNER_TEMP/preview/bin/python"
          "$py" -m pip install ".[gui,keyring]" pytest "pyinstaller==6.22.3"
          (cd "$RUNNER_TEMP" && "$py" -m pytest "$GITHUB_WORKSPACE/tests")
      - name: Bundle the application
        shell: bash
        run: |
          py="$RUNNER_TEMP/preview/bin/python"
          printf '%s\n' 'from tidal_dl_ng.gui import gui_activate' 'gui_activate()' > preview_launcher.py
          args=(--onedir --name tdn-preview --copy-metadata tidal-dl-ng
            --copy-metadata keyring --collect-submodules keyring.backends
            --add-data tidal_dl_ng/ui/icon.png:tidal_dl_ng/ui
            --add-data tidal_dl_ng/ui/default_album_image.png:tidal_dl_ng/ui
            --add-data LICENSE:.)
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=(--windowed --icon tidal_dl_ng/ui/icon.icns --osx-bundle-identifier org.tidal-dl-ng.preview)
          fi
          "$py" -m PyInstaller "${args[@]}" preview_launcher.py
      - name: Package and launch the macOS ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-files "$RUNNER_TEMP/mac-smoke"
          mv dist/tdn-preview.app 'dist/TIDAL Downloader NG.app'
          asset="tidal-dl-ng-$TARGET.zip"
          ditto -c -k --sequesterRsrc --keepParent 'dist/TIDAL Downloader NG.app' "release-files/$asset"
          ditto -x -k "release-files/$asset" "$RUNNER_TEMP/mac-smoke"
          (cd "$RUNNER_TEMP" && env PATH=/usr/bin:/bin             "$RUNNER_TEMP/mac-smoke/TIDAL Downloader NG.app/Contents/MacOS/tdn-preview" --portable-smoke-test)
          (cd release-files && shasum -a 256 "$asset" > "$asset.sha256")
      - name: Package and launch the Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-files AppDir
          cp -a dist/tdn-preview/. AppDir/
          cp tidal_dl_ng/ui/icon.png AppDir/tidal-dl-ng.png
          ln -s tidal-dl-ng.png AppDir/.DirIcon
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          exec "$(dirname "$(readlink -f "$0")")/tdn-preview" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/tidal-dl-ng.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=TIDAL Downloader NG
          Exec=tdn-preview
          Icon=tidal-dl-ng
          Categories=AudioVideo;Audio;
          Terminal=false
          EOF
          tool="$RUNNER_TEMP/appimagetool.AppImage"
          curl -fLsS --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$tool"
          printf '%s  %s\n' ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 "$tool" | sha256sum -c -
          chmod +x "$tool"
          asset="tidal-dl-ng-$TARGET.AppImage"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$tool" AppDir "release-files/$asset"
          (cd "$RUNNER_TEMP" && env PATH=/usr/bin:/bin APPIMAGE_EXTRACT_AND_RUN=1             "$GITHUB_WORKSPACE/release-files/$asset" --portable-smoke-test)
          (cd release-files && sha256sum "$asset" > "$asset.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release-files/
          if-no-files-found: error

  windows:
    uses: ./.github/workflows/windows-portable.yml
    with:
      source_ref: aac92e77c8965874be129af18d4e8db7653cfb05

  publish:
    if: github.ref == 'refs/heads/master'
    needs: [package, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish verified Windows, macOS and Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-files
          win=tidal-dl-ng-windows-x64.zip
          expected=$(tr -d '\r\n' < "$win.sha256")
          printf '%s  %s\n' "${expected,,}" "$win" | sha256sum --check
          sha256sum --check tidal-dl-ng-macos-*.zip.sha256 tidal-dl-ng-linux-*.AppImage.sha256
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --prerelease \
            --title "TIDAL Downloader NG 0.24.6 Preview 2" \
            --notes "Fixes incomplete multi-segment downloads, preserves saved logins during validation failures, and applies a shared cooldown to media-transfer rate limits. Windows x64, macOS Apple Silicon and Intel, and Linux x86-64 packages passed packaged launch tests. SHA-256 files are included. The Windows executable is unsigned and the macOS app is not notarized." \
            ./*.zip ./*.AppImage ./*.sha256
